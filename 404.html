<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — LJB Media Group</title>
    <meta
      name="description"
      content="The page you requested could not be found on the LJB Media Group website."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://ljbbrands.github.io/" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family:
          Sora,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #000;
        color: #fff;
      }
      main {
        width: min(34rem, 100%);
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(12, 14, 12, 0.92);
      }
      p.eyebrow {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      h1 {
        margin: 0.85rem 0 0;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        letter-spacing: -0.03em;
      }
      p.copy {
        margin: 1rem 0 0;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.62);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 1.5rem;
        padding: 0 1.25rem;
        border-radius: 999px;
        background: #b8ff5a;
        color: #061006;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">LJB Media Group</p>
      <h1>Page not found.</h1>
      <p class="copy">
        That link does not match a published page. Return to the homepage to
        continue exploring LJB Media Group.
      </p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
