name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci
      - run: npm run ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:site

      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit

      - run: npm run test:e2e:webkit
